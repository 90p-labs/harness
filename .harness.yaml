git:
  default_branch: main
# The owner lets the agent mark a PR ready and merge it in this repository.
guard:
  disabled: [pr-no-merge, pr-draft-only]
verify:
  parallel: 3
gates:
  - id: go-fmt
    run: test -z "$(gofmt -l .)"
    paths:
      - '**/*.go'
  - id: go-vet
    run: go vet ./...
  # No paths: colocated tests also read the docs, the examples and the plugin files.
  - id: go-test
    run: make cover
    needs: [go-fmt, go-vet]
  - id: prose
    run: HARNESS_PROSE_BASE=main go test -count=1 -run '^TestChangedProse$' ./skills/

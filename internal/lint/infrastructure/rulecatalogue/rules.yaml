packs:
  - name: ddd
    rules:
      - id: ddd/src-roots
        description: Every source file and every dependency belongs to a known context or layer. The tool reports a file or a dependency that it cannot place, and never drops it.
      - id: ddd/domain-purity
        description: The domain layer depends only on itself, the shared domain and the allowed libraries, never on the application or infrastructure layer or a framework.
      - id: ddd/layer-direction
        description: The application layer depends on the domain layer, never on the infrastructure layer.
      - id: ddd/cross-context
        description: A bounded context depends on another context only through its public entry point or its published events.
      - id: ddd/file-suffix
        description: A file in a layer has a name that tells its role, such as a command, a handler, an aggregate or a repository.

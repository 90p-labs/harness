name: release

on:
  push:
    tags: ['v*']
  workflow_call:
    inputs:
      tag:
        required: true
        type: string

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Validate the tag
        run: |
          if ! [[ $TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "the tag must look like v1.2.3, got: $TAG"
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: refs/tags/${{ env.TAG }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - name: Check the tag against the plugin manifests
        run: scripts/release.sh check "$TAG"
      - name: Build the binaries
        run: make dist VERSION="$TAG"
      - name: Write the release notes
        run: scripts/release.sh notes "$TAG" > "$RUNNER_TEMP/notes.md"
      - name: Publish the release
        run: gh release create "$TAG" dist/harness-* --title "$TAG" --verify-tag --notes-file "$RUNNER_TEMP/notes.md"

name: lint-engines

on:
  push:
    branches: [main]
  pull_request:

# pull-requests: write lets the coverage step post its comment on the pull request.
permissions:
  contents: read
  pull-requests: write

jobs:
  lint-engines:
    runs-on: ubuntu-latest
    # The tests commit in temporary repositories, and the runner has no git identity.
    env:
      GIT_AUTHOR_NAME: ci
      GIT_AUTHOR_EMAIL: ci@example.invalid
      GIT_COMMITTER_NAME: ci
      GIT_COMMITTER_EMAIL: ci@example.invalid
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm i -g @biomejs/biome@2.6.6 oxlint@1.92.0
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.4
      - name: check
        run: |
          set -o pipefail
          make check 2>&1 | tee "$RUNNER_TEMP/check.log"
      # One comment per pull request, found by its marker and updated on each push.
      # A pull request from a fork gets a read-only token, so the step skips it.
      - name: coverage comment
        if: >-
          always() && github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        # The comment is a report: an API error never fails the build.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          marker='<!-- coverage-floor -->'
          log="$RUNNER_TEMP/check.log"
          body="$RUNNER_TEMP/coverage-comment.md"
          line=$(grep -E '^coverage: ' "$log" 2>/dev/null | tail -n 1 || true)
          if [ -z "$line" ]; then
            result='not measured: `make check` failed before `make cover` ran'
          elif grep -q '^coverfloor: coverage .* is below the floor' "$log"; then
            result="below the floor: ${line#coverage: }"
          else
            result="ok: ${line#coverage: }"
          fi
          {
            echo "$marker"
            echo "### Coverage"
            echo
            echo "Total Go statement coverage, $result."
            echo
            echo "Commit ${SHA}, floor from \`COVERAGE_FLOOR\` in the Makefile."
          } > "$body"
          id=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR/comments" \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\"))) | .id" | tail -n 1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -F "body=@$body" > /dev/null
          else
            gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file "$body"
          fi
      - name: engine tests
        run: go test -tags linters ./internal/lint/... -count=1

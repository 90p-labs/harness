name: lint-engines

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-engines:
    runs-on: ubuntu-latest
    # The tests commit in temporary repositories, and the runner has no git identity.
    env:
      GIT_AUTHOR_NAME: ci
      GIT_AUTHOR_EMAIL: ci@example.invalid
      GIT_COMMITTER_NAME: ci
      GIT_COMMITTER_EMAIL: ci@example.invalid
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm i -g @biomejs/biome@2.6.6 oxlint@1.92.0
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.4
      - name: check
        run: make check
      - name: engine tests
        run: go test -tags linters ./internal/lint/... -count=1

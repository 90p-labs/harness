name: auto-release

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: auto-release
  cancel-in-progress: false

jobs:
  tag:
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(release):') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.next.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - name: Pick the next version
        id: next
        run: |
          tag=$(scripts/release.sh next)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Write the plugin manifests
        if: steps.next.outputs.tag != ''
        env:
          TAG: ${{ steps.next.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          scripts/release.sh bump "$TAG"
          if ! git diff --quiet; then
            git commit -a -m "chore(release): $TAG"
          fi
      - name: Check the plugin manifests
        if: steps.next.outputs.tag != ''
        env:
          TAG: ${{ steps.next.outputs.tag }}
        run: scripts/release.sh check "$TAG"
      - name: Build the binaries
        if: steps.next.outputs.tag != ''
        env:
          TAG: ${{ steps.next.outputs.tag }}
        run: make dist VERSION="$TAG"
      - name: Tag and push
        if: steps.next.outputs.tag != ''
        env:
          TAG: ${{ steps.next.outputs.tag }}
          TOKEN: ${{ github.token }}
        run: |
          git tag -a "$TAG" -m "$TAG"
          auth=$(printf 'x-access-token:%s' "$TOKEN" | base64 | tr -d '\n')
          echo "::add-mask::$auth"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push --atomic origin HEAD:main "$TAG"

  release:
    needs: tag
    if: needs.tag.outputs.tag != ''
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.tag.outputs.tag }}

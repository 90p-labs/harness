name: my-symfony-app

services:
  php:
    image: composer:2.11.1@sha256:8de2184c6de224f4689e8f80ed5f5edaf0030b6b8b7839a22a2bcb6722ac87d0
    working_dir: /app
    volumes:
      - .:/app
      - composer-cache:/tmp/cache
    environment:
      COMPOSER_CACHE_DIR: /tmp/cache

volumes:
  composer-cache:

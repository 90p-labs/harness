plugins:
  - name: go-arch-lint
    command: [sh, -c, 'exec sh "$(git rev-parse --show-toplevel)/.harness/plugins/go-arch-lint.sh"']
    events: [lint.check]
    timeout: 60s

lint:
  packs: [./lint/architecture]

verify:
  parallel: 2

setup:
  - id: go-mod
    run: docker compose run --rm -T go go mod download
    paths: [go.mod, go.sum, compose.yaml]

gates:
  - id: go-fmt
    run: docker compose run --rm -T go sh -c 'out=$(gofmt -l . 2>&1); test -z "$out" || { echo "$out"; exit 1; }'
    paths: ["**/*.go", go.mod, go.sum, compose.yaml]
  - id: go-vet
    run: docker compose run --rm -T go go vet ./...
    paths: &go-inputs ["**/*.go", "**/testdata/**", go.mod, go.sum, go.work, go.work.sum, compose.yaml]
  - id: go-test
    run: docker compose run --rm -T go go test ./...
    paths: *go-inputs
    needs: [go-fmt, go-vet]
  - id: lint
    run: harness lint --json
    baseline: .harness-lint/baseline.json
  - id: lint-canaries
    run: harness lint canaries

lint:
  packs: [nextjs, shadcn]

verify:
  parallel: 3

setup:
  - id: node-install
    run: docker compose run --rm -T node pnpm install --frozen-lockfile
    paths: [.npmrc, package.json, pnpm-lock.yaml, pnpm-workspace.yaml, compose.yaml, Dockerfile]

gates:
  - id: node-typecheck
    run: docker compose run --rm -T node sh -c 'pnpm exec next typegen && pnpm exec tsc --noEmit'
    paths: &node-inputs ["**/*.ts", "**/*.tsx", "**/*.js", "**/*.jsx", "**/*.mjs", "**/*.cjs", "**/*.mts", "**/*.cts", "**/*.json", .npmrc, pnpm-lock.yaml, pnpm-workspace.yaml, compose.yaml, Dockerfile]
  - id: node-lint
    run: docker compose run --rm -T node pnpm run lint
    paths: *node-inputs
  - id: lint
    run: harness lint --json
    baseline: .harness-baseline/lint.json
  - id: node-build
    run: docker compose run --rm -T node pnpm run build
    paths: ["**/*.ts", "**/*.tsx", "**/*.js", "**/*.jsx", "**/*.mjs", "**/*.cjs", "**/*.mts", "**/*.cts", "**/*.json", "**/*.css", "public/**", .npmrc, pnpm-lock.yaml, pnpm-workspace.yaml, compose.yaml, Dockerfile]
    needs: [node-typecheck, node-lint, lint]

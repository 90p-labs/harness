plugins:
  - name: ruff
    command: [sh, .harness/plugins/ruff-lint.sh]
    events: [lint.check]
    timeout: 60s
lint:
  packs: [./lint/python]

verify:
  parallel: 2

setup:
  - id: py-install
    run: docker compose run --rm -T python uv sync --locked
    paths: [pyproject.toml, uv.lock, .python-version, compose.yaml]

gates:
  - id: py-typecheck
    run: docker compose run --rm -T python uv run --no-sync mypy .
    paths: &python-inputs ["**/*.py", "**/*.pyi", "**/py.typed", "tests/**", pyproject.toml, uv.lock, .python-version, compose.yaml]
  - id: lint
    run: harness lint --json
    baseline: .harness-baseline/lint.json
  - id: py-test
    run: docker compose run --rm -T python uv run --no-sync pytest
    paths: *python-inputs
    needs: [py-typecheck, lint]

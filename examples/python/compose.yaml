name: my-python-app

services:
  python:
    image: ghcr.io/astral-sh/uv:0.13.7-python3.14-trixie-slim@sha256:e80c05a310400cfc90af00b5b7271ef9ad24816e3265e1162af8a678e1aad099
    working_dir: /app
    environment:
      UV_PROJECT_ENVIRONMENT: /opt/venv
      UV_CACHE_DIR: /opt/uv-cache
      UV_PYTHON_DOWNLOADS: never
      UV_LINK_MODE: copy
    volumes:
      - .:/app
      - venv:/opt/venv
      - uv-cache:/opt/uv-cache

volumes:
  venv:
  uv-cache:

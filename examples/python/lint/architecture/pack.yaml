name: architecture
rules:
  - id: ddd/src-roots
    engine: import-linter
    severity: error
    scope: "src/**/*.py"
    message: Each source file sits in a context and a layer that .importlinter lists.
  - id: ddd/domain-purity
    engine: import-linter
    severity: error
    scope: "src/**/*.py"
    message: The domain uses only itself, the shared domain, the standard library and the allowed modules.
  - id: ddd/layer-direction
    engine: import-linter
    severity: error
    scope: "src/**/*.py"
    message: The application layer uses the domain layer, never the infrastructure layer.
  - id: ddd/cross-context
    engine: import-linter
    severity: error
    scope: "src/**/*.py"
    message: A bounded context uses another context only through its public entry point, and the shared kernel uses no context.
